name: ci

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format (google-java-format via Spotless)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Apply formatter and fail on any difference
        run: |
          ./mvnw -B -ntp spotless:apply
          if ! git diff --quiet; then
            echo "::error::Code is not formatted. Run ./mvnw spotless:apply. Diff follows."
            git diff | tee spotless.patch
            exit 1
          fi
      - name: Upload formatting patch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spotless-patch
          path: spotless.patch
          if-no-files-found: ignore

  build:
    name: build, static analysis, tests, coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Pin Docker API version for Testcontainers
        run: |
          docker version
          echo "api.version=1.44" > ~/.docker-java.properties
      - name: Compile (Error Prone), unit and integration tests (Testcontainers), coverage
        run: ./mvnw -B -ntp -Dspotless.check.skip=true verify
      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Line coverage (JaCoCo)"
            echo "| module | covered | missed | % |"
            echo "|---|---|---|---|"
            for csv in */target/site/jacoco/jacoco.csv; do
              [ -f "$csv" ] || continue
              awk -F, -v m="${csv%%/*}" 'NR>1 {c+=$9; x+=$8} END {if (c+x>0) printf "| %s | %d | %d | %.1f |\n", m, c, x, 100*c/(c+x)}' "$csv"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Chaos, concurrency, cost and sample output summary
        if: always()
        run: |
          # Printed to the log as well as the summary, so results can be quoted from a real run.
          reports=enricher-app/target/failsafe-reports
          chaos=$reports/io.github.xeeshan16.enricher.chaos.ExactlyOnceChaosIT-output.txt
          sample=$reports/io.github.xeeshan16.enricher.app.DisputeTriagePipelineIT-output.txt
          engine=$reports/io.github.xeeshan16.enricher.engine.ConcurrencyAndRetryIT-output.txt
          cost=$reports/io.github.xeeshan16.enricher.engine.CostControlIT-output.txt
          budget=enricher-ledger-postgres/target/failsafe-reports/io.github.xeeshan16.enricher.ledger.postgres.PostgresBudgetStoreIT-output.txt
          observability=$reports/io.github.xeeshan16.enricher.app.ObservabilityIT-output.txt
          {
            if [ -f "$chaos" ]; then
              echo "### Exactly-once chaos test"
              echo '```'
              grep -E "chaos: (committed|ledger)" "$chaos" | sed -E 's/.*(chaos: )/\1/'
              echo '```'
            fi
            if [ -f "$engine" ]; then
              echo "### Concurrency, retry topics and dead-lettering"
              echo '```'
              grep -E "(concurrency|routing): " "$engine" | sed -E 's/.*((concurrency|routing): )/\1/'
              echo '```'
            fi
            if [ -f "$cost" ] || [ -f "$budget" ]; then
              echo "### Budgets, skip rules and adaptive concurrency"
              echo '```'
              [ -f "$cost" ] && grep -E "(cost|ratelimit): " "$cost" | sed -E 's/.*((cost|ratelimit): )/\1/'
              [ -f "$budget" ] && grep -E "^budget: " "$budget"
              echo '```'
            fi
            if [ -f "$observability" ]; then
              echo "### Trace of one record and exported series (ObservabilityIT)"
              echo '```'
              grep -E "^TRACE_SPAN" "$observability" | sed -E 's/^TRACE_SPAN //'
              grep -E "^PROMETHEUS (gen_ai_client_operation_seconds_count|enricher_record_process_seconds_count|enricher_cost_usd_total|enricher_provider_calls_total|enricher_pii_masked_total)" "$observability" | sed -E 's/^PROMETHEUS //'
              echo '```'
            fi
            if [ -f "$sample" ]; then
              echo "### Sample envelopes (fake provider)"
              echo '```'
              grep -E "^SAMPLE_ENVELOPE" "$sample" | sed -E 's/^SAMPLE_ENVELOPE //'
              echo '```'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            */target/surefire-reports/
            */target/failsafe-reports/
            */target/site/jacoco/
          if-no-files-found: ignore

  docker:
    name: docker image, compose demo smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: kafka-llm-enricher:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image size and user
        run: docker image inspect kafka-llm-enricher:local --format '{{.Size}} bytes, user {{.Config.User}}'
      - name: Start the demo (docker compose up)
        run: docker compose up -d --no-build
      - name: Smoke test
        env:
          SMOKE_OUT: smoke
        run: |
          set -o pipefail
          scripts/smoke-test.sh 2>&1 | tee smoke-test.log
          {
            echo "### Compose demo smoke test"
            echo '```'
            grep -E '^(ok |not yet|MISSING|all |process |chat |send |smoke)' smoke-test.log | awk 'NR <= 60'
            echo '```'
            echo "### Sample envelopes from the demo stream"
            echo '```'
            grep '"enrichment"' smoke/enriched.txt | awk 'NR <= 3'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Enricher logs
        if: always()
        run: docker compose logs enricher --no-color | tail -200
      - name: Upload smoke-test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-smoke
          path: |
            smoke/
            smoke-test.log
          if-no-files-found: ignore
      - name: Stop the demo
        if: always()
        run: docker compose down -v

  helm:
    name: helm chart lint and render
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Lint
        run: helm lint deploy/helm/kafka-llm-enricher --strict
      - name: Render (defaults and all options)
        run: |
          helm template demo deploy/helm/kafka-llm-enricher > rendered-defaults.yaml
          helm template demo deploy/helm/kafka-llm-enricher \
            --set serviceMonitor.enabled=true \
            --set tracing.otlpEndpoint=http://otel-collector:4318/v1/traces \
            --set provider.name=openai --set provider.existingSecret=llm-keys \
            --set database.existingSecret=enricher-db \
            --set 'env[0].name=ENRICHER_RPM' --set-string 'env[0].value=500' > rendered-all.yaml
          python3 scripts/check-helm-render.py rendered-defaults.yaml rendered-all.yaml
      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: helm-rendered
          path: rendered-*.yaml
