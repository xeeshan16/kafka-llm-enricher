spring:
  application:
    name: kafka-llm-enricher
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 50
      # Read only committed records, so chained pipelines never enrich an aborted result.
      isolation-level: read-committed
    producer:
      acks: all
      # Enables Kafka transactions (exactly-once read-process-write). Must be unique per instance:
      # the default adds a random suffix; on Kubernetes, ENRICHER_TX_ID_PREFIX=enricher-${POD_NAME}-
      # gives stable, readable ids.
      transaction-id-prefix: ${ENRICHER_TX_ID_PREFIX:enricher-${random.uuid}-}
      properties:
        enable.idempotence: true
  datasource:
    url: ${ENRICHER_DB_URL:jdbc:postgresql://localhost:5432/enricher}
    username: ${ENRICHER_DB_USER:enricher}
    password: ${ENRICHER_DB_PASSWORD:enricher}
    hikari:
      maximum-pool-size: ${ENRICHER_DB_POOL_SIZE:10}
  # The result ledger runs its own migrations with its own history table.
  flyway:
    enabled: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

# Health probes (/actuator/health/liveness, /readiness), Prometheus scrape (/actuator/prometheus)
# and OpenTelemetry traces. Traces are exported over OTLP only when an endpoint is set, for
# example MANAGEMENT_OTLP_TRACING_ENDPOINT=http://otel-collector:4318/v1/traces.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: ${ENRICHER_HEALTH_DETAILS:always}
      group:
        # A dead consumer loop does not come back by itself: let Kubernetes restart the pod.
        liveness:
          include: livenessState,enricher
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        gen_ai.client.operation: true
        enricher.record.process: true
  tracing:
    sampling:
      probability: ${ENRICHER_TRACE_SAMPLING:0.1}
  observations:
    key-values:
      deployment.environment: ${ENRICHER_ENVIRONMENT:local}

enricher:
  auto-startup: ${ENRICHER_AUTO_STARTUP:true}
  # fake (offline, deterministic), openai (OpenAI, Ollama, vLLM or any OpenAI-compatible server),
  # anthropic or azure-openai. Keys come from the environment only.
  provider: ${ENRICHER_PROVIDER:fake}
  providers:
    fake:
      # Simulated model latency for demos and load tests (the default fake answers instantly).
      latency: ${ENRICHER_FAKE_LATENCY:0ms}
      latency-jitter: ${ENRICHER_FAKE_LATENCY_JITTER:0ms}
    openai:
      # Ollama: http://localhost:11434/v1 (no key). vLLM: http://<host>:8000/v1.
      base-url: ${ENRICHER_OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${ENRICHER_OPENAI_API_KEY:}
      # json-schema (constrained decoding), json-object, or none (schema in the system prompt).
      structured-output: ${ENRICHER_OPENAI_STRUCTURED_OUTPUT:json-schema}
      temperature: ${ENRICHER_OPENAI_TEMPERATURE:0}
      request-timeout: ${ENRICHER_PROVIDER_REQUEST_TIMEOUT:60s}
    anthropic:
      base-url: ${ENRICHER_ANTHROPIC_BASE_URL:https://api.anthropic.com}
      api-key: ${ENRICHER_ANTHROPIC_API_KEY:}
      request-timeout: ${ENRICHER_PROVIDER_REQUEST_TIMEOUT:60s}
    azure-openai:
      endpoint: ${ENRICHER_AZURE_OPENAI_ENDPOINT:}
      api-key: ${ENRICHER_AZURE_OPENAI_API_KEY:}
      api-version: ${ENRICHER_AZURE_OPENAI_API_VERSION:2024-10-21}
      request-timeout: ${ENRICHER_PROVIDER_REQUEST_TIMEOUT:60s}
  delivery: ${ENRICHER_DELIVERY:auto}
  # Timeout and in-place retries (full jitter) of every model call.
  resilience:
    call-timeout: ${ENRICHER_CALL_TIMEOUT:30s}
    max-attempts: ${ENRICHER_MAX_ATTEMPTS:3}
    initial-backoff: 200ms
    max-backoff: 5s
  # Provider quotas, enforced per instance before every call (0 = no limit). With N replicas on
  # one API key, give each about 1/N of the key's quota. Concurrency adapts to 429s (AIMD).
  rate-limit:
    requests-per-minute: ${ENRICHER_RPM:0}
    tokens-per-minute: ${ENRICHER_TPM:0}
    max-wait: ${ENRICHER_RATE_LIMIT_MAX_WAIT:5s}
    initial-concurrency: 16
    max-concurrency: ${ENRICHER_MAX_PROVIDER_CONCURRENCY:64}
  # USD per million tokens, for cost metrics and cost budgets. The fake provider is free (the
  # demo profile gives it illustrative prices).
  pricing:
    fake-1:
      input-per-million: 0
      output-per-million: 0
  # Tenant tags on cost, token and ledger metrics, bounded so many merchants stay cheap to scrape.
  metrics:
    tenant-tag: ${ENRICHER_METRICS_TENANT_TAG:true}
    max-tenants: ${ENRICHER_METRICS_MAX_TENANTS:100}
  # Synthetic dispute stream (DisputeGenerator); on in the demo profile.
  demo:
    generator:
      enabled: false
      topic: payments.disputes
  ledger:
    store: ${ENRICHER_LEDGER_STORE:auto}
    # Covers the first call and one repair call, each with retries (see README).
    lease-ttl: ${ENRICHER_LEDGER_LEASE_TTL:4m}
    busy-wait: 2s
    initialize-schema: ${ENRICHER_LEDGER_INIT_SCHEMA:true}
  topics:
    create: ${ENRICHER_CREATE_TOPICS:true}
    partitions: 3
    replication-factor: 1
  pipelines:
    dispute-triage:
      input-topic: payments.disputes
      output-topic: payments.disputes.enriched
      dead-letter-topic: payments.disputes.enricher-dlq
      # v2: masked prompt and injection guard. Bump it whenever the prompt, schema or masking change.
      prompt-version: v2
      model: ${ENRICHER_DISPUTE_MODEL:fake-1}
      # Per-key order within a partition; unrelated keys are enriched in parallel.
      ordering: key
      max-in-flight: ${ENRICHER_MAX_IN_FLIGHT:16}
      max-pending-per-partition: 500
      # Retryable failures that survive the in-place attempts go to
      # payments.disputes.enricher-retry-1 (after 10 s), then -2 (after 1 min), then the DLQ.
      retry-delays: 10s,1m
      max-output-tokens: 256
      # Spend is accounted per merchant. To cap it, add for example:
      #   skip:
      #     tiny-amount: "event.amount != null and event.amount < 1"
      #   budget:
      #     period: daily
      #     max-cost-usd: 50
      #     on-exceeded: downgrade      # or defer / skip
      #     fallback-model: gpt-4o-mini
      #     after-downgrade: defer
      tenant: event.merchant
      output-schema: classpath:schemas/dispute-triage.v1.json
      # Card numbers, IBANs, emails and phone numbers become [PAN_1]-style placeholders before the
      # prompt is rendered; list fields to blank out entirely in mask-fields.
      mask-pii: pan,iban,email,phone
      # mask-fields: customer.name
      # The guard frames the event as untrusted data; it is prepended to system-prompt.
      prompt-guard: true
      # Personal data in an answer: mask, reject (dead-letter as PII_IN_OUTPUT) or allow.
      output-pii: mask
      # One repair prompt for an answer that is not JSON or breaks the schema (a paid call).
      repair-attempts: ${ENRICHER_REPAIR_ATTEMPTS:1}
      system-prompt: |
        You triage card payment disputes for a payments operations team.
      user-template: |
        Classify this dispute. Merchant: {{event.merchant}}.
        {{event}}
